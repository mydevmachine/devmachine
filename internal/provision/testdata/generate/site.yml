---
# Generated by devmachine. Every run rewrites it; do not edit.
- hosts: devmachine
  become: true
  tasks:
    - name: base
      include_role:
        name: base
        apply:
          tags: [base]
      tags: [base]

    - name: firewall
      include_role:
        name: firewall
        apply:
          tags: [firewall]
      tags: [firewall]

    - name: caddy
      include_role:
        name: caddy
        apply:
          tags: [caddy]
      tags: [caddy]

    - name: docker
      include_role:
        name: docker
        apply:
          tags: [docker]
      tags: [docker]

    - name: claude-code for alice
      include_role:
        name: claude-code
        apply:
          tags: [claude-code]
      vars:
        devmachine_claude_code_plugins:
          - one
          - two
      loop:
        - {name: "alice", user: "alice"}
      loop_control:
        loop_var: devmachine_workspace
      tags: [claude-code]

    - name: dev for each workspace that declares it
      include_role:
        name: dev
        apply:
          tags: [dev]
      loop:
        - {name: "alice", user: "alice"}
        - {name: "bob", user: "bob"}
      loop_control:
        loop_var: devmachine_workspace
      tags: [dev]

    - name: sharing for each workspace that declares it
      include_role:
        name: sharing
        apply:
          tags: [sharing]
      loop:
        - {name: "alice", user: "alice"}
      loop_control:
        loop_var: devmachine_workspace
      tags: [sharing]

    - name: look for the shared gh login
      stat:
        path: "/etc/devmachine/gh/hosts.yml"
      register: devmachine_shared_gh
      check_mode: false
      tags: [dev, credentials]

    - name: the shared gh login, for the workspaces that want it
      shell: |
        set -eu
        user={{ devmachine_shared.user | quote }}
        rel={{ devmachine_shared.path | quote }}
        runuser -u "$user" -- /bin/sh -c '
        set -eu
        umask 077
        rel=$1
        user=$(id -un)
        if command -v getent >/dev/null 2>&1; then
          home=$(getent passwd "$user" | cut -d: -f6)
        else
          home=$(dscl . -read "/Users/$user" NFSHomeDirectory 2>/dev/null | cut -d" " -f2-)
        fi
        outside() {
          echo "~/$rel reaches outside the home of $user through a symbolic link, so the shared login was not copied there" >&2
          exit 1
        }
        cd "$home"
        real_home=$(pwd -P)
        dir=$(dirname "$rel")
        probe=$dir
        while [ ! -e "$probe" ] && [ ! -L "$probe" ]; do
          probe=$(dirname "$probe")
        done
        if ! real_dir=$(cd -P "$probe" 2>/dev/null && pwd -P); then
          echo "~/$rel: ~/$probe is not a directory" >&2
          exit 1
        fi
        case "$real_dir/" in
        "$real_home"/*) ;;
        *) outside ;;
        esac
        if [ -L "$rel" ]; then
          outside
        fi
        mkdir -p "$dir"
        if [ "$dir" != . ]; then
          chmod 0700 "$dir"
        fi
        tmp=$(mktemp "$dir/.devmachine.XXXXXX")
        cat > "$tmp"
        mode=$(stat -c %a "$rel" 2>/dev/null || stat -f %Lp "$rel" 2>/dev/null || true)
        if [ -f "$rel" ] && [ "$mode" = 600 ] && cmp -s "$tmp" "$rel"; then
          rm -f "$tmp"
          exit 0
        fi
        chmod 0600 "$tmp"
        mv -f "$tmp" "$rel"
        echo changed
        ' devmachine-share "$rel" < '/etc/devmachine/gh/hosts.yml'
      register: devmachine_shared_gh_copy
      changed_when: "'changed' in devmachine_shared_gh_copy.stdout"
      loop:
        - {user: "alice", path: ".config/gh/hosts.yml"}
      loop_control:
        loop_var: devmachine_shared
      when: devmachine_shared_gh.stat.exists
      tags: [dev, credentials]

    - name: claude-code again, now that the shared logins are in place
      include_role:
        name: claude-code
        apply:
          tags: [claude-code]
      vars:
        devmachine_claude_code_plugins:
          - one
          - two
      loop:
        - {name: "alice", user: "alice"}
      loop_control:
        loop_var: devmachine_workspace
      tags: [claude-code]

    - name: dev again, now that the shared logins are in place
      include_role:
        name: dev
        apply:
          tags: [dev]
      loop:
        - {name: "alice", user: "alice"}
        - {name: "bob", user: "bob"}
      loop_control:
        loop_var: devmachine_workspace
      tags: [dev]

    - name: sharing again, now that the shared logins are in place
      include_role:
        name: sharing
        apply:
          tags: [sharing]
      loop:
        - {name: "alice", user: "alice"}
      loop_control:
        loop_var: devmachine_workspace
      tags: [sharing]

    - name: sharing extends caddy.sites.d for alice
      copy:
        src: "/opt/devmachine/roles/sharing/files/sharing.caddy"
        dest: "/etc/caddy/sites.d/alice-sharing-sharing.caddy"
        owner: root
        group: root
        mode: "0644"
      register: devmachine_extension_0
      tags: [sharing]

    - name: files the configuration no longer owns
      file:
        path: "{{ item.path }}"
        state: absent
      loop:
        - {path: "/etc/caddy/sites.d/alice-routes.caddy"}
        - {path: "/etc/caddy/sites.d/bob-routes.caddy"}
      register: devmachine_routes_removed
      tags: [routes]

    - name: reload caddy for the routes
      systemd:
        name: caddy
        state: reloaded
      when: ansible_facts['system'] == 'Linux' and ((devmachine_routes_written is defined and devmachine_routes_written is changed) or (devmachine_routes_removed is defined and devmachine_routes_removed is changed) or (devmachine_extension_0 is defined and devmachine_extension_0 is changed))
      tags: [routes]

